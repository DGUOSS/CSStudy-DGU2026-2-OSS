# main에 push되면: 검사(ci.yml) 통과 후 프론트(Vercel)와 백엔드(Render)에 배포한다.
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions)
#   VERCEL_TOKEN       Vercel 토큰 (vercel.com/account/tokens)
#   VERCEL_ORG_ID      Vercel 팀 id (frontend/.vercel/project.json의 orgId)
#   VERCEL_PROJECT_ID  Vercel 프로젝트 id (같은 파일의 projectId)
#   DEPLOY_REPO_TOKEN  Render가 보는 배포용 레포(Kachipuchipa/dgu-study)에 push할 수 있는 GitHub 토큰
# Render는 배포용 레포의 main에 push가 오면 스스로 배포한다(마이그레이션 포함).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  frontend:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Vercel 배포
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN secret이 없습니다"; exit 1; fi
          # git 정보 없이 배포한다(커밋 작성자가 Vercel 팀 멤버가 아니면 배포가 막히기 때문)
          cp -r frontend "$RUNNER_TEMP/fe"
          cd "$RUNNER_TEMP/fe"
          npx --yes vercel@65.14.0 deploy --prod --yes --token "$VERCEL_TOKEN"

  backend:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 배포용 레포로 전달 (Render 자동 배포)
        env:
          DEPLOY_REPO_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          if [ -z "$DEPLOY_REPO_TOKEN" ]; then echo "::error::DEPLOY_REPO_TOKEN secret이 없습니다"; exit 1; fi
          git push "https://x-access-token:${DEPLOY_REPO_TOKEN}@github.com/Kachipuchipa/dgu-study.git" HEAD:main
