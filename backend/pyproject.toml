[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studyplanner-backend"
version = "0.1.0"
description = "Backend for the DGU weekly study planner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
