[project]
name = "dgu-study-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.15.0",
    "anthropic>=2.9.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy<2",
    "opencv-python-headless>=4.11.0.86",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pybkt>=1.4.3",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "rapidfuzz>=3.14.6",
    "scikit-learn<1.7",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
    "qgen",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:pyBKT.*",
    "ignore:Using `httpx`:DeprecationWarning",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # 긴 줄은 ruff format이 정리한다

[tool.uv.sources]
qgen = { git = "https://github.com/DGUOSS/CSStudy-DGU2026-2-OSS", rev = "8c80e9cd1064bad30642ddba834e7bf79b75f1d4", subdirectory = "question-ai" }
